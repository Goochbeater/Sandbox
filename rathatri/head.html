<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark Legacy: Rathatri</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0707">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rathatri">
<style>
  /* palette: ink #0b0707, crimson #e0231a / #b3120a, bone #e9dccb, dim #9c8a80, gold #d9a441, Force violet #9b3cff, rage amber #ff8a1a.
     Type: system stack only (no web fonts), heavy weights and letter-spaced caps for titles. */
  :root { --red: #e0231a; --red2: #b3120a; --deep: #3a0503; --ink: #0b0707; --bone: #e9dccb; --dim: #9c8a80; --gold: #d9a441;
          --force: #9b3cff; --rage: #ff8a1a; --ember: #ff5a48;
          --f: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          /* phone-landscape metrics. --tu is the touch unit: the same formula as TOUCH.layout (TOUCH.u overrides it from JS). */
          --tu: clamp(40px, min(15.2vh, 7.4vw), 78px);
          --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
          --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
          /* type scale: nothing is set under 12px */
          --t-lab: clamp(12px, 2.9vh, 14px); --t-body: clamp(14px, 3.9vh, 17px); --t-obj: clamp(14px, 4.1vh, 18px);
          /* thumb keep-out: the joystick sits left of 2.9u, the button cluster starts right of 5.3u from the edge */
          --gl: calc(var(--sl) + 2.9 * var(--tu)); --gr: calc(var(--sr) + 5.3 * var(--tu)); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
         touch-action: none; font-family: var(--f); color: var(--bone); }
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
  #cv { position: absolute; left: 0; top: 0; display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  .ui { position: absolute; pointer-events: none; }
  #err { position: absolute; left: 20px; right: 20px; top: 20px; color: #fff; background: #600; font: 12px/1.4 Menlo, monospace;
         white-space: pre-wrap; padding: 12px; display: none; z-index: 99; max-height: 70%; overflow: auto; pointer-events: auto; }
  /* ---------------- loader (also reused by GAME.start for level names) */
  #boot { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          background: radial-gradient(ellipse at 50% 40%, #2b0707 0%, #0b0707 60%, #050303 100%);
          padding: var(--st) var(--sr) var(--sb) var(--sl); box-sizing: border-box; transition: opacity 1.2s; }
  #boot h1 { margin: 0; font-weight: 900; font-size: clamp(30px, min(8.4vw, 15vh), 92px); line-height: 1; letter-spacing: 0.22em; padding-left: 0.22em;
             color: var(--bone); text-shadow: 0 0 26px rgba(224,35,26,0.45); }
  #boot h1 span { color: var(--red); text-shadow: 0 0 28px rgba(255,30,10,0.85); }
  #boot h2 { margin: clamp(8px, 1.8vh, 14px) 0 clamp(20px, 6vh, 46px); font-weight: 700; font-size: var(--t-lab); letter-spacing: 0.6em; padding-left: 0.6em; color: #c9a59b; }
  #ldTrack { width: min(56vw, 520px); height: 3px; background: rgba(224,35,26,0.14); position: relative; overflow: visible; }
  #ldBar { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 2px; transition: width 0.25s;
           background: linear-gradient(90deg, #5e0603, #e0231a 72%, #fff1ea); box-shadow: 0 0 6px 1px #ff3a24, 0 0 18px 4px rgba(224,35,26,0.6);
           animation: ldCrackle 0.18s steps(2) infinite alternate; }
  #ldBar::after { content: ''; position: absolute; right: -5px; top: -5px; width: 10px; height: 13px; background: #fff6f0;
                  clip-path: polygon(55% 0, 15% 55%, 48% 55%, 30% 100%, 90% 42%, 55% 42%, 80% 0); filter: drop-shadow(0 0 4px #ff3a24) drop-shadow(0 0 8px #ff2a10); }
  @keyframes ldCrackle { from { opacity: 1; } to { opacity: 0.8; } }
  #ldMsg { margin-top: 18px; font-size: var(--t-lab); letter-spacing: 0.4em; color: #9c7f76; text-transform: uppercase; }
  #ldQuote { position: absolute; left: 50%; bottom: calc(var(--sb) + 5vh); transform: translateX(-50%); width: min(80vw, 760px); text-align: center;
             font-size: var(--t-body); font-style: italic; letter-spacing: 0.03em; line-height: 1.4; color: #8a706a; }
  /* ---------------- HUD (phone landscape: everything keeps out of the thumb zones) */
  #hud { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
  #hud.on { opacity: 1; }
  /* top-left stack: name, health, Force, rage, chapter, status chip, holocrons */
  #hpBox { position: absolute; left: calc(var(--sl) + 14px); top: calc(var(--st) + 10px); width: calc(var(--tu) * 3.3); max-width: 42vw; }
  body.lefty #hpBox { left: auto; right: calc(var(--sr) + 14px); }
  .barLbl { display: inline-block; font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.42em; line-height: 1; color: var(--bone); text-transform: uppercase;
            border-left: 3px solid var(--red); padding: 2px 0 2px 8px; white-space: nowrap; text-shadow: 0 1px 4px #000; }
  #essence { position: absolute; right: 0; top: -2px; font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.12em; color: var(--gold); white-space: nowrap;
             opacity: 0; text-shadow: 0 1px 4px #000; }
  body.lefty #essence { right: auto; left: 0; }
  #essence.on { animation: essUp 1.6s ease-out forwards; }
  @keyframes essUp { 0% { opacity: 0; transform: translateY(6px); } 14% { opacity: 1; transform: translateY(0); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  #chapT { margin: 6px 0 0 11px; font-size: var(--t-lab); letter-spacing: 0.1em; color: #9c8780; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chapT:empty { display: none; }
  .bar { position: relative; overflow: hidden; background: rgba(22,5,4,0.8);
         clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
  #hpBar { height: clamp(10px, 2.5vh, 14px); margin-top: 8px; }
  #hpLag { background: #f3c9b2; opacity: 0.5; }
  #hpFill { background: linear-gradient(90deg, #6e0603, #e0231a 72%, #ff8a6a); box-shadow: 0 0 12px rgba(224,35,26,0.55); }
  #fpBar { height: clamp(6px, 1.6vh, 9px); margin-top: 6px; }
  #fpFill { background: linear-gradient(90deg, #2a0a40, #9b3cff 72%, #e4c8ff); box-shadow: 0 0 10px rgba(155,60,255,0.6); }
  #rageBar { height: clamp(4px, 1.2vh, 6px); margin-top: 6px; background: rgba(28,12,2,0.8); }
  #rageFill { background: linear-gradient(90deg, #5e2200, #ff8a1a 72%, #fff0b0); box-shadow: 0 0 10px rgba(255,138,26,0.7); }
  #rageBar.full { animation: ragePulseBar 0.55s ease-in-out infinite alternate; }
  #rageBar.full #rageFill { animation: ragePulseFill 0.55s ease-in-out infinite alternate; }
  @keyframes ragePulseBar { from { background: rgba(28,12,2,0.8); } to { background: rgba(110,46,0,0.9); } }
  @keyframes ragePulseFill { from { filter: brightness(1); } to { filter: brightness(1.7); } }
  #chip { display: none; margin-top: 9px; width: max-content; max-width: 100%; font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.26em; line-height: 1;
          padding: 5px 9px 4px; text-transform: uppercase; color: #ffe9dd; background: rgba(224,35,26,0.22); border: 1px solid rgba(224,35,26,0.75); border-radius: 3px; }
  #chip.on { display: block; }
  #chip.rage { color: #fff1d8; background: rgba(255,138,26,0.22); border-color: rgba(255,138,26,0.8); }
  #chip.force { color: #f1e2ff; background: rgba(155,60,255,0.22); border-color: rgba(155,60,255,0.8); }
  #chip.gold { color: #fff0cf; background: rgba(217,164,65,0.2); border-color: rgba(217,164,65,0.75); }
  body.lefty #chip { margin-left: auto; }
  #holo { margin-top: 8px; font-size: var(--t-lab); line-height: 1.35; letter-spacing: 0.14em; color: #c9a6ff; opacity: 0.92; }
  #holo:empty { display: none; }
  /* top-centre column: objective, boss bar (replaces the objective), EXPOSURE meter, hint pill */
  #topc { position: absolute; left: 50%; top: calc(var(--st) + 10px); transform: translateX(-50%); width: 46vw;
          display: flex; flex-direction: column; align-items: center; gap: 7px; }
  #obj { max-width: 100%; text-align: center; max-height: 60px; transition: opacity 0.4s, max-height 0.4s; }
  #hud.bossUp #obj { opacity: 0; max-height: 0; overflow: hidden; }
  #objT { font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.45em; padding-left: 0.45em; color: var(--gold); text-transform: uppercase; line-height: 1.2; text-shadow: 0 1px 4px #000; }
  #objD { max-width: 46vw; margin: 3px auto 0; font-size: var(--t-obj); font-weight: 700; letter-spacing: 0.03em; line-height: 1.3; color: var(--bone);
          text-shadow: 0 1px 6px #000, 0 0 2px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #boss { display: none; width: min(44vw, 460px); text-align: center; }
  #boss.on { display: block; animation: bossIn 0.45s ease-out; }
  @keyframes bossIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  #bossN { font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.36em; padding-left: 0.36em; color: var(--bone); text-transform: uppercase; margin-bottom: 6px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 4px #000; }
  #bossBar { position: relative; height: clamp(7px, 1.9vh, 10px); background: rgba(22,5,4,0.85);
             clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  #bossFill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #5e0603, #e0231a 72%, #ffb0a0); box-shadow: 0 0 12px rgba(224,35,26,0.6); }
  #bossFill.green { background: linear-gradient(90deg, #2a0a40, #9b3cff 72%, #e4c8ff); box-shadow: 0 0 12px rgba(155,60,255,0.6); }
  #bossFill.foe { background: linear-gradient(90deg, #5a3a0a, #d9a441 72%, #fff0cf); box-shadow: 0 0 12px rgba(217,164,65,0.55); }
  #bossGuard { position: relative; height: 3px; margin-top: 4px; background: rgba(233,220,203,0.1); }
  #bossGuardF { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bone); opacity: 0.7; }
  #bossSub { font-size: var(--t-lab); letter-spacing: 0.26em; color: #b0968d; margin-top: 5px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bossSub:empty { display: none; }
  #heat { display: none; width: min(24vw, 240px); align-items: center; gap: 8px; }
  #heat.on { display: flex; }
  #heatLbl { font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.28em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
  #heatTrk { position: relative; flex: 1; height: 5px; background: rgba(22,5,4,0.85); }
  #heatF { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #6e5a3a, #d9a441); transition: width 0.3s; }
  #heat[data-t="2"] #heatF { background: linear-gradient(90deg, #8a3a00, #ff8a1a); }
  #heat[data-t="3"] #heatF, #heat[data-t="4"] #heatF { background: linear-gradient(90deg, #6e0603, #e0231a); box-shadow: 0 0 8px rgba(224,35,26,0.8); }
  #heat[data-t="3"] #heatTrk, #heat[data-t="4"] #heatTrk { animation: heatPulse 0.7s ease-in-out infinite alternate; }
  @keyframes heatPulse { from { box-shadow: 0 0 0 rgba(224,35,26,0); } to { box-shadow: 0 0 10px rgba(224,35,26,0.9); } }
  #heatTrk > i.tk { position: absolute; top: -3px; bottom: -3px; width: 1px; margin-left: -0.5px; background: rgba(233,220,203,0.55); }
  #heatT { min-width: 2.4em; text-align: right; font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.1em; color: var(--bone); }
  #hint { position: relative; box-sizing: border-box; max-width: 44vw; padding: 5px 14px; font-size: clamp(12px, 3.1vh, 15px); line-height: 1.25; letter-spacing: 0.05em; text-align: center;
          color: #f4e9df; background: rgba(11,7,7,0.76); border: 1px solid rgba(224,35,26,0.5); border-radius: 999px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 0.3s; }
  #hint.on { opacity: 1; }
  #hint:empty { display: none; }
  body.cine #hint { opacity: 0; }
  /* combo counter: left-middle, clear of the thumbs */
  #combo { position: absolute; left: calc(var(--sl) + 14px); top: 40%; text-align: left; opacity: 0; transition: opacity 0.25s; }
  body.lefty #combo { left: auto; right: calc(var(--sr) + 14px); text-align: right; }
  #combo.on { opacity: 1; }
  #cN { font-size: clamp(32px, 9.5vh, 50px); font-weight: 900; font-style: italic; line-height: 0.9; color: #fff; text-shadow: 0 0 16px rgba(224,35,26,0.9); }
  #cL { font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.4em; color: var(--ember); }
  #cR { margin-top: 4px; font-size: clamp(16px, 4.6vh, 22px); font-weight: 900; letter-spacing: 0.18em; color: var(--ember); text-shadow: 0 0 12px rgba(224,35,26,0.8); }
  #cRbar { position: relative; width: calc(var(--tu) * 1.5); height: 3px; margin-top: 5px; background: rgba(224,35,26,0.22); }
  body.lefty #cRbar { margin-left: auto; }
  #cRfill { position: absolute; right: 0; top: 0; bottom: 0; background: var(--red); box-shadow: 0 0 8px rgba(224,35,26,0.9); }
  /* lock-on reticle and the world-anchored prompt */
  #lock { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; opacity: 0; transition: opacity 0.12s; }
  #lock.on { opacity: 1; }
  #lock:before, #lock:after { content: ''; position: absolute; inset: 0; border: 2px solid var(--red); transform: rotate(45deg) scale(0.62); box-shadow: 0 0 10px rgba(224,35,26,0.8); }
  #lock:after { border-color: rgba(233,220,203,0.85); transform: rotate(45deg) scale(0.3); box-shadow: none; }
  #prompt { position: absolute; font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.12em; line-height: 1.1; color: var(--bone); white-space: nowrap;
            transform: translate(-50%, -50%); padding: 6px 12px 5px; border-radius: 999px; background: rgba(11,7,7,0.82);
            border: 1px solid rgba(224,35,26,0.6); box-shadow: 0 0 14px rgba(224,35,26,0.25); opacity: 0; transition: opacity 0.15s; }
  #prompt.on { opacity: 1; }
  /* toast: centre, under the objective column */
  #toast { position: absolute; left: 50%; top: 31%; transform: translateX(-50%); width: 70vw; text-align: center; opacity: 0; transition: opacity 0.4s; }
  #toast.on { opacity: 1; }
  #hud.bossUp #toast { top: 40%; }   /* the boss bar and hint pill push the column down */
  #toastA { font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.5em; padding-left: 0.5em; color: var(--gold); text-transform: uppercase; text-shadow: 0 1px 4px #000; }
  #toastA:empty { display: none; }
  #toastB { margin-top: 4px; font-size: clamp(20px, 6.2vh, 34px); font-weight: 900; letter-spacing: 0.2em; padding-left: 0.2em; color: #fff; text-transform: uppercase;
            text-shadow: 0 0 18px rgba(224,35,26,0.85), 0 2px 6px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* keyboard keys and the button chips that IN.keyLabel() returns (kbd.tb = crimson touch chip) */
  kbd { display: inline-block; min-width: 18px; padding: 1px 7px; margin: 0 3px; border: 1px solid #ff7060; border-radius: 3px; font: 700 14px var(--f); color: #ffd6cc; background: rgba(255,50,30,0.15); }
  kbd.tb { min-width: 0; margin: 0 6px 0 0; padding: 2px 7px 1px; border: 0; border-radius: 3px; font: 800 12px/1.3 var(--f); letter-spacing: 0.12em; text-transform: uppercase;
           color: #fff; background: linear-gradient(180deg, #ea2b20, #b3120a); box-shadow: 0 0 8px rgba(224,35,26,0.55), inset 0 1px 0 rgba(255,255,255,0.25); vertical-align: 1px; }
  /* subtitles: bottom centre, in the gap between the joystick and the button cluster; widen during cinematics */
  #sub { position: absolute; left: var(--gl); right: var(--gr); bottom: calc(var(--sb) + 3.2vh); text-align: center; font-size: var(--t-body); line-height: 1.32;
         letter-spacing: 0.01em; color: #f6ece2; text-shadow: 0 2px 8px #000, 0 0 2px #000; opacity: 0; transition: opacity 0.3s, left 0.4s, right 0.4s; }
  body.lefty #sub { left: var(--gr); right: var(--gl); }
  #sub.on { opacity: 1; }
  #sub b { display: inline; margin-right: 0.5em; font-size: var(--t-lab); font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ember); text-shadow: 0 1px 4px #000; }
  #sub b.jedi { color: #8fb8ff; }
  #sub b.sid { color: #c49bff; }
  body.cine #sub { left: 10vw; right: 10vw; bottom: calc(var(--sb) + 9vh + 2.4vh); }
  /* damage vignette, flash, letterbox (cinematic) and the old keyboard skip line (now empty: the touch SKIP button is #tskip) */
  #vig { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 46%, rgba(150,0,0,0.78) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #lbT, #lbB { position: absolute; left: 0; right: 0; height: 0; background: #000; transition: height 0.6s ease; z-index: 5; }
  #lbT { top: 0; } #lbB { bottom: 0; }
  body.cine #lbT, body.cine #lbB { height: 9vh; }
  #skip { display: none; }
  /* ---------------- intro: boot gate (TAP TO BEGIN), film or title card */
  #intro { position: absolute; inset: 0; background: #000; z-index: 70; display: none; transition: opacity 1.4s; cursor: pointer; overflow: hidden; touch-action: none; }
  #introV { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #introSkip { position: absolute; right: calc(var(--sr) + 16px); bottom: calc(var(--sb) + 12px); font-size: var(--t-lab); font-weight: 700; letter-spacing: 0.3em; color: #a08a80; transition: opacity 0.6s; z-index: 3; }
  #introBar { position: absolute; left: calc(var(--sl) + 16px); bottom: calc(var(--sb) + 16px); width: min(22vw, 200px); height: 2px; background: rgba(224,35,26,0.18); z-index: 3; transition: opacity 0.6s; }
  #introBar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--red); box-shadow: 0 0 8px #ff2010; }
  #introTitle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none;
                opacity: 0; z-index: 2; padding: var(--st) var(--sr) var(--sb) var(--sl); box-sizing: border-box; }
  #introTitle.on { opacity: 1; animation: itPush 5.4s linear forwards; }
  #introTitle .it-glow { position: absolute; left: 50%; top: 50%; width: 110vw; height: 80vh; transform: translate(-50%, -50%); opacity: 0;
                         background: radial-gradient(ellipse at center, rgba(170,14,6,0.38) 0%, rgba(90,6,2,0.16) 38%, rgba(0,0,0,0) 70%); }
  #introTitle.on .it-glow { animation: itFade 2.6s ease-out 0.3s forwards, itPulse 3s ease-in-out 3s infinite; }
  #introTitle .it-d { font-weight: 800; font-size: clamp(13px, 2.8vh, 22px); letter-spacing: 1em; padding-left: 1em; color: #d2bcb0; opacity: 0; }
  #introTitle.on .it-d { animation: itRise 1.4s ease-out 0.45s forwards; }
  #introTitle .it-m { font-weight: 900; font-size: clamp(64px, min(17vw, 27vh), 250px); line-height: 0.9; letter-spacing: 0.08em; padding-left: 0.08em; color: var(--red);
    text-shadow: 0 0 22px rgba(255,40,10,0.95), 0 0 70px rgba(255,20,0,0.6), 0 0 160px rgba(200,10,0,0.45); opacity: 0; filter: blur(18px); transform: scale(1.12); }
  #introTitle.on .it-m { animation: itMaul 2.1s cubic-bezier(.2,.7,.2,1) 0.15s forwards; }
  #introTitle .it-blade { position: relative; width: 0; height: 3px; margin: clamp(10px, 2.4vh, 22px) 0 clamp(8px, 2vh, 18px); border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, rgba(255,90,70,0), #fff6f0 30%, #ff6a50 50%, #fff6f0 70%, rgba(255,90,70,0));
    box-shadow: 0 0 6px 2px #ff4020, 0 0 22px 6px rgba(255,30,0,0.75); }
  #introTitle.on .it-blade { animation: itBlade 0.55s cubic-bezier(.3,1.4,.4,1) 1.2s forwards, itFlick 0.09s steps(2) 1.8s 12 alternate; }

# Netlify configuration for the drag-and-drop zip (eni-tutor-netlify-drop.zip).
# The zip is the site root: index.html, preview.html, netlify/edge-functions/chat.js.
# Nothing is built on upload, so there is no build command.
[build]
  publish = "."

# The page posts to /api/v1/chat/completions. Send that to the OpenRouter relay,
# which reads OPENROUTER_API_KEY from the site's environment.
[[edge_functions]]
  path = "/api/v1/chat/completions"
  function = "chat"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

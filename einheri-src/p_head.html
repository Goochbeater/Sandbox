<title>Einheri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: one fixed full-bleed canvas; HUD hugs the top corners, thumbs own the bottom corners, story lives bottom-centre. */
:root{
  --ink:#0c0908; --ink2:#17110e; --bone:#eadfc8; --bone-dim:#a89a86;
  --ember:#ff8a2b; --gold:#e5b45a; --gold-hi:#ffe2a0; --frost:#a8dcff;
  --blood:#c22f22; --ash:#6f655d; --panel:rgba(13,10,9,.88); --line:rgba(234,223,200,.22);
  --display:'Cinzel','Trajan Pro','Times New Roman',Georgia,serif;
  --body:'IM Fell English','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{font-family:var(--body);overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink)}
.ov{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;top:0;right:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;transition:opacity .4s}
#hud.hide{opacity:0}
.hpwrap{display:flex;flex-direction:column;gap:5px;min-width:0}
.hpbar{position:relative;width:min(34vw,250px);height:13px;background:rgba(0,0,0,.55);
  border:1px solid rgba(229,180,90,.55);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.hpbar i{position:absolute;inset:0;transform-origin:left;transition:transform .12s}
.hpbar .lag{background:#f3e3c3;opacity:.55;transition:transform .7s .25s}
.hpbar .fill{background:linear-gradient(180deg,#e2563c,#9c1d14 70%,#6d120c)}
.hpbar .shine{background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 55%);transform:none}
.hprow{display:flex;align-items:center;gap:8px}
.knot{width:22px;height:22px;flex:none;filter:drop-shadow(0 0 4px rgba(229,180,90,.35))}
.sub{display:flex;gap:14px;align-items:center;font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--bone-dim);padding-left:30px}
.sub b{color:var(--gold-hi);font-weight:600}
.runes{display:flex;gap:5px}
.runes span{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--gold);opacity:.6}
.runes span.on{background:var(--gold);box-shadow:0 0 8px var(--ember);opacity:1}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(10,8,7,.5);
  display:grid;place-items:center;cursor:pointer}
#pauseBtn svg{width:16px;height:16px}

#bossbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(40vw,460px);
  text-align:center;pointer-events:none;transition:opacity .6s;opacity:0}
#bossbar.on{opacity:1}
#bossbar .nm{font-family:var(--display);font-size:13px;letter-spacing:.32em;color:var(--bone);text-shadow:0 0 10px #000;margin-bottom:5px;text-transform:uppercase}
#bossbar .bar{position:relative;height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(234,223,200,.35)}
#bossbar .bar i{position:absolute;inset:0;transform-origin:left}
#bossbar .bar .lag{background:#fff2d6;opacity:.5;transition:transform .9s .3s}
@media (orientation:portrait){#bossbar{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px);width:min(80vw,460px)}}
#bossbar .bar .fill{background:linear-gradient(90deg,#7a1c12,#e0592f,#ffb14a);transition:transform .1s}
#bossbar .tick{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--bone);opacity:.6}

/* ---------- touch controls ---------- */
#ctrl{position:fixed;inset:0;pointer-events:none;transition:opacity .35s}
#ctrl.hide{opacity:0}
#ctrl.hide *{pointer-events:none!important}
#stickZone{position:absolute;left:0;top:18%;bottom:0;width:50%;pointer-events:auto}
#stickBase,#stickKnob{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s}
#stickBase{width:116px;height:116px;margin:-58px 0 0 -58px;border:1.5px solid rgba(234,223,200,.28);
  background:radial-gradient(circle,rgba(234,223,200,.06),rgba(0,0,0,.25) 70%)}
#stickKnob{width:48px;height:48px;margin:-24px 0 0 -24px;background:radial-gradient(circle at 40% 35%,rgba(255,236,200,.5),rgba(200,170,130,.18));
  border:1px solid rgba(255,236,200,.5)}
#stickZone.on #stickBase,#stickZone.on #stickKnob{opacity:1}
#stickHint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 46px);bottom:calc(env(safe-area-inset-bottom,0px) + 46px);width:96px;height:96px;
  border-radius:50%;border:1px dashed rgba(234,223,200,.18);pointer-events:none;transition:opacity .4s}
#stickZone.on ~ #stickHint{opacity:0}
.btn{position:absolute;border-radius:50%;pointer-events:auto;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(30,22,18,.55),rgba(8,6,5,.7));border:1.5px solid rgba(234,223,200,.3);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 14px rgba(0,0,0,.6);transition:transform .08s,border-color .15s,opacity .2s}
.btn.dn{transform:scale(.92);border-color:var(--gold-hi)}
.btn svg{width:46%;height:46%;pointer-events:none}
#bAtk{width:84px;height:84px;right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);border-color:rgba(229,180,90,.55)}
#bAtk .chg{position:absolute;inset:-6px;border-radius:50%;pointer-events:none}
#bDodge{width:60px;height:60px;right:calc(env(safe-area-inset-right,0px) + 124px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.pw{width:52px;height:52px;font-family:var(--display);font-size:22px;color:var(--gold-hi)}
#bP1{right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
#bP2{right:calc(env(safe-area-inset-right,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}
.pw.empty{opacity:.25}
.pw.dry{color:var(--ash);border-color:rgba(111,101,93,.4)}
.pw .pips{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.pw .pips i{width:7px;height:3px;background:rgba(234,223,200,.2)}
.pw .pips i.on{background:var(--gold);box-shadow:0 0 5px var(--ember)}
.pw .ring{position:absolute;inset:-4px;border-radius:50%;pointer-events:none}
#bAct{right:calc(env(safe-area-inset-right,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);width:auto;height:40px;border-radius:20px;
  padding:0 18px;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi);
  border-color:rgba(229,180,90,.6);opacity:0;transform:translateY(8px)}
#bAct.on{opacity:1;transform:none}
#bAct:not(.on){pointer-events:none}

/* ---------- toasts / cards ---------- */
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;width:min(90vw,700px)}
#toast .t{font-family:var(--display);font-size:clamp(18px,3.4vw,30px);letter-spacing:.2em;color:var(--gold-hi);text-shadow:0 0 18px rgba(255,138,43,.55),0 2px 4px #000;
  opacity:0;transition:opacity .6s,transform .6s;transform:translateY(6px);text-wrap:balance}
#toast .s{font-family:var(--body);font-style:italic;font-size:clamp(14px,2.2vw,18px);color:var(--bone);margin-top:6px;opacity:0;transition:opacity .6s .15s;text-wrap:balance}
#toast.on .t,#toast.on .s{opacity:1;transform:none}
#note{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);font-family:var(--display);font-size:12px;
  letter-spacing:.14em;color:var(--bone);background:rgba(0,0,0,.45);padding:6px 14px;border:1px solid var(--line);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#note.on{opacity:1}

#card{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity 1.1s;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.85))}
#card.on{opacity:1;pointer-events:auto}
#card .in{text-align:center;max-width:min(88vw,760px);padding:0 16px}
#card .k{font-family:var(--display);font-size:12px;letter-spacing:.5em;color:var(--ember);text-transform:uppercase}
#card h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vw,64px);letter-spacing:.14em;margin:.25em 0 .1em;color:var(--bone);
  text-shadow:0 0 30px rgba(255,138,43,.35);text-wrap:balance}
#card .ep{font-family:var(--body);font-style:italic;font-size:clamp(15px,2.4vw,20px);color:var(--bone-dim)}
#card .on1{font-family:var(--body);font-style:italic;font-size:clamp(17px,3vw,26px);color:var(--gold-hi);margin-top:1.4em;line-height:1.35;text-wrap:balance}
#card .tr{font-family:var(--body);font-size:clamp(14px,2.2vw,18px);color:var(--bone);margin-top:.6em;line-height:1.45;text-wrap:balance}
#card .src{font-family:var(--display);font-size:10px;letter-spacing:.3em;color:var(--ash);margin-top:1.2em;text-transform:uppercase}
#card .tap{font-family:var(--display);font-size:10px;letter-spacing:.3em;color:var(--ash);margin-top:2.4em;opacity:.8;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.25}}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
#hurtv{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,10,5,.55))}

/* ---------- dialogue ---------- */
#dlg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);width:min(94vw,780px);
  display:flex;gap:14px;align-items:flex-start;padding:14px 18px 16px;background:linear-gradient(180deg,rgba(18,13,11,.94),rgba(9,7,6,.96));
  border:1px solid rgba(229,180,90,.32);box-shadow:0 10px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#dlg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dlg::before,#dlg::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold);opacity:.6}
#dlg::before{left:-4px;top:-4px;border-right:0;border-bottom:0}
#dlg::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
#dlg canvas{flex:none;width:76px;height:76px;border-radius:50%;border:1px solid rgba(229,180,90,.5);background:#0b0807}
#dlg.np canvas{display:none}
#dlg .tx{flex:1;min-width:0}
#dlg .who{font-family:var(--display);font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:4px}
#dlg .say{font-size:clamp(15px,2.3vw,19px);line-height:1.42;min-height:2.8em;color:var(--bone)}
#dlg.narr .say{font-style:italic;color:#d9ccb3}
#dlg.stone .say{font-family:var(--display);font-size:clamp(13px,2vw,16px);letter-spacing:.06em;line-height:1.6;color:#d6c8a8}
#dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--gold);animation:pulse 1.4s infinite}
#choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#choices button{text-align:left;background:rgba(229,180,90,.06);border:1px solid rgba(229,180,90,.28);padding:8px 12px;cursor:pointer;
  font-size:clamp(14px,2.1vw,17px);color:var(--bone);transition:background .15s}
#choices button:hover,#choices button:active{background:rgba(229,180,90,.18)}
#choices button .nw{color:var(--ember);font-family:var(--display);font-size:11px;margin-left:8px;letter-spacing:.15em}
#choices button.bye{color:var(--bone-dim);font-style:italic}

/* ---------- panels: menu / shop / title ---------- */
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,4,3,.72);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.panel.on{display:flex}
.sheet{width:min(96vw,860px);max-height:100%;overflow:auto;background:linear-gradient(180deg,#15100d,#0b0807);border:1px solid rgba(229,180,90,.3);
  padding:18px 20px 20px;box-shadow:0 20px 60px #000;touch-action:pan-y}
.sheet h2{font-family:var(--display);font-weight:600;letter-spacing:.24em;font-size:17px;margin:0 0 4px;color:var(--gold-hi);text-transform:uppercase}
.sheet h3{font-family:var(--display);font-weight:400;letter-spacing:.24em;font-size:11px;margin:16px 0 8px;color:var(--ember);text-transform:uppercase}
.sheet p.lead{margin:0 0 6px;color:var(--bone-dim);font-style:italic}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.cols>*{min-width:0}
#mapc{width:100%;aspect-ratio:1/1;max-height:52vh;background:#0a0807;border:1px solid var(--line);display:block;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{background:rgba(229,180,90,.07);border:1px solid rgba(229,180,90,.32);padding:9px 14px;cursor:pointer;font-family:var(--display);
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone)}
.mbtn:active{background:rgba(229,180,90,.2)}
.mbtn.warn{border-color:rgba(194,47,34,.6);color:#f0b4a8}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{border:1px solid var(--line);padding:8px;cursor:pointer;background:rgba(255,255,255,.02);min-width:0}
.pcard.lock{opacity:.3;cursor:default}
.pcard.sel{border-color:var(--gold);background:rgba(229,180,90,.1)}
.pcard .g{font-family:var(--display);font-size:22px;color:var(--gold-hi)}
.pcard .n{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.pcard .d{font-size:13px;color:var(--bone-dim);line-height:1.3;margin-top:3px}
.pcard .sl{font-family:var(--display);font-size:10px;color:var(--ember);letter-spacing:.1em}
.sheet p.fine{font-size:13px;line-height:1.5;color:var(--bone-dim);margin:4px 0 8px}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:15px}
.stat b{font-family:var(--display);font-weight:400;color:var(--gold-hi);font-size:13px}
.shop .item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-bottom:1px solid var(--line);padding:10px 0;align-items:center}
.shop .item .n{font-family:var(--display);letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.shop .item .d{font-size:14px;color:var(--bone-dim);grid-column:1}
.shop .item .lv{display:flex;gap:3px;margin-top:4px}
.shop .item .lv i{width:12px;height:4px;background:rgba(234,223,200,.18)}
.shop .item .lv i.on{background:var(--gold)}
.shop .item button{grid-row:1/4;grid-column:2}
.shop .item button[disabled]{opacity:.35}
.purse{font-family:var(--display);color:var(--gold-hi);letter-spacing:.1em}
input[type=range]{width:100%;accent-color:var(--gold)}
label.set{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:15px;margin:6px 0}

#title{position:fixed;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 40%,rgba(4,6,10,.62),rgba(4,6,10,0));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));transition:opacity 1.2s}
#title.off{opacity:0;pointer-events:none}
#title .k{font-family:var(--display);font-size:11px;letter-spacing:.6em;color:var(--ember);text-transform:uppercase}
#title h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,12vw,124px);letter-spacing:.2em;margin:0;padding-left:.2em;line-height:1;
  background:linear-gradient(180deg,#fff3d6,#e5b45a 55%,#8a5320);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,138,43,.35)) drop-shadow(0 3px 2px #000)}
#title .st{font-family:var(--body);font-style:italic;font-size:clamp(15px,2.6vw,22px);color:var(--bone)}
#title .menu{display:flex;flex-direction:column;gap:10px;margin-top:4vh;min-width:220px}
#title .menu button{background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 26px;cursor:pointer;
  font-family:var(--display);font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone);transition:color .2s,background .2s}
#title .menu button:active,#title .menu button:hover{color:var(--gold-hi);background:rgba(229,180,90,.07)}
#title .menu button[hidden]{display:none}
#title .foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:12px;color:var(--ash);font-style:italic;padding:0 16px}
#confirm{display:none;flex-direction:column;gap:8px;align-items:center;margin-top:2vh;font-size:15px}
#confirm.on{display:flex}
#rot{position:fixed;inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 54px) 0;text-align:center;font-size:13px;color:var(--bone-dim);font-style:italic;display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
#credits{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;overflow:hidden;background:#000;pointer-events:auto}
#credits.on{display:flex}
#credits .roll{text-align:center;padding:0 16px 40px;max-width:640px;will-change:transform}
#credits h2{font-family:var(--display);letter-spacing:.3em;color:var(--gold-hi);font-weight:400;font-size:20px;margin:1.6em 0 .4em}
#credits p{margin:.3em 0;line-height:1.5;color:var(--bone)}
#credits .q{font-style:italic;color:var(--bone-dim)}
@media (orientation:landscape){
  #title{align-items:flex-start;text-align:left;padding-left:max(6vw,env(safe-area-inset-left,0px));background:radial-gradient(ellipse 48% 70% at 22% 50%,rgba(4,6,10,.7),rgba(4,6,10,0))}
  #title h1{font-size:clamp(40px,9vw,112px);letter-spacing:.16em;padding-left:0}
  #title .k{letter-spacing:.5em}
  #title .st{max-width:44vw}
  #title .menu{align-items:stretch}
  #title .foot{left:max(6vw,env(safe-area-inset-left,0px));padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>

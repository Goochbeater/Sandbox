# Netlify configuration: ENI tutor, locked build.
[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

# The page posts to /api/v1/chat/completions. Send that to the OpenRouter relay,
# which holds OPENROUTER_API_KEY server-side.
[[redirects]]
  from = "/api/v1/chat/completions"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Single-page fallback for any deep link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-cache"

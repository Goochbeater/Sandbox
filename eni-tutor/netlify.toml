# Netlify configuration: ENI tutor, locked build.
[build]
  publish = "dist"
  command = "npm run build"

# The page posts to /api/v1/chat/completions. The edge function relays it to
# OpenRouter, reading OPENROUTER_API_KEY from the site's environment.
[[edge_functions]]
  path = "/api/v1/chat/completions"
  function = "chat"

# Single-page fallback for any deep link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-cache"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0908">
<title>Einheri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: one fixed full-bleed canvas; HUD hugs the top corners, thumbs own the bottom corners, story lives bottom-centre. */
:root{
  --ink:#0c0908; --ink2:#17110e; --bone:#eadfc8; --bone-dim:#a89a86;
  --ember:#ff8a2b; --gold:#e5b45a; --gold-hi:#ffe2a0; --frost:#a8dcff;
  --blood:#c22f22; --ash:#6f655d; --panel:rgba(13,10,9,.88); --line:rgba(234,223,200,.22);
  --display:'Cinzel','Trajan Pro','Times New Roman',Georgia,serif;
  --body:'IM Fell English','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{font-family:var(--body);overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:var(--ink)}
.ov{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;top:0;right:0;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) 0 calc(env(safe-area-inset-left,0px) + 12px);
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;transition:opacity .4s}
#hud.hide{opacity:0}
.hpwrap{display:flex;flex-direction:column;gap:5px;min-width:0}
.hpbar{position:relative;width:min(34vw,250px);height:13px;background:rgba(0,0,0,.55);
  border:1px solid rgba(229,180,90,.55);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.hpbar i{position:absolute;inset:0;transform-origin:left;transition:transform .12s}
.hpbar .lag{background:#f3e3c3;opacity:.55;transition:transform .7s .25s}
.hpbar .fill{background:linear-gradient(180deg,#e2563c,#9c1d14 70%,#6d120c)}
.hpbar .shine{background:linear-gradient(180deg,rgba(255,255,255,.25),transparent 55%);transform:none}
.hprow{display:flex;align-items:center;gap:8px}
.knot{width:22px;height:22px;flex:none;filter:drop-shadow(0 0 4px rgba(229,180,90,.35))}
.sub{display:flex;gap:14px;align-items:center;font-family:var(--display);font-size:12px;letter-spacing:.08em;color:var(--bone-dim);padding-left:30px}
.sub b{color:var(--gold-hi);font-weight:600}
.runes{display:flex;gap:5px}
.runes span{width:10px;height:10px;transform:rotate(45deg);border:1px solid var(--gold);opacity:.6}
.runes span.on{background:var(--gold);box-shadow:0 0 8px var(--ember);opacity:1}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(10,8,7,.5);
  display:grid;place-items:center;cursor:pointer}
#pauseBtn svg{width:16px;height:16px}

#bossbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(40vw,460px);
  text-align:center;pointer-events:none;transition:opacity .6s;opacity:0}
#bossbar.on{opacity:1}
#bossbar .nm{font-family:var(--display);font-size:13px;letter-spacing:.32em;color:var(--bone);text-shadow:0 0 10px #000;margin-bottom:5px;text-transform:uppercase}
#bossbar .bar{position:relative;height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(234,223,200,.35)}
#bossbar .bar i{position:absolute;inset:0;transform-origin:left}
#bossbar .bar .lag{background:#fff2d6;opacity:.5;transition:transform .9s .3s}
@media (orientation:portrait){#bossbar{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px);width:min(80vw,460px)}}
#bossbar .bar .fill{background:linear-gradient(90deg,#7a1c12,#e0592f,#ffb14a);transition:transform .1s}
#bossbar .tick{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--bone);opacity:.6}

/* ---------- touch controls ---------- */
#ctrl{position:fixed;inset:0;pointer-events:none;transition:opacity .35s}
#ctrl.hide{opacity:0}
#ctrl.hide *{pointer-events:none!important}
#stickZone{position:absolute;left:0;top:18%;bottom:0;width:50%;pointer-events:auto}
#stickBase,#stickKnob{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s}
#stickBase{width:116px;height:116px;margin:-58px 0 0 -58px;border:1.5px solid rgba(234,223,200,.28);
  background:radial-gradient(circle,rgba(234,223,200,.06),rgba(0,0,0,.25) 70%)}
#stickKnob{width:48px;height:48px;margin:-24px 0 0 -24px;background:radial-gradient(circle at 40% 35%,rgba(255,236,200,.5),rgba(200,170,130,.18));
  border:1px solid rgba(255,236,200,.5)}
#stickZone.on #stickBase,#stickZone.on #stickKnob{opacity:1}
#stickHint{position:absolute;left:calc(env(safe-area-inset-left,0px) + 46px);bottom:calc(env(safe-area-inset-bottom,0px) + 46px);width:96px;height:96px;
  border-radius:50%;border:1px dashed rgba(234,223,200,.18);pointer-events:none;transition:opacity .4s}
#stickZone.on ~ #stickHint{opacity:0}
.btn{position:absolute;border-radius:50%;pointer-events:auto;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(30,22,18,.55),rgba(8,6,5,.7));border:1.5px solid rgba(234,223,200,.3);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),inset 0 0 14px rgba(0,0,0,.6);transition:transform .08s,border-color .15s,opacity .2s}
.btn.dn{transform:scale(.92);border-color:var(--gold-hi)}
.btn svg{width:46%;height:46%;pointer-events:none}
#bAtk{width:84px;height:84px;right:calc(env(safe-area-inset-right,0px) + 28px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);border-color:rgba(229,180,90,.55)}
#bAtk .chg{position:absolute;inset:-6px;border-radius:50%;pointer-events:none}
#bDodge{width:60px;height:60px;right:calc(env(safe-area-inset-right,0px) + 124px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}
.pw{width:52px;height:52px;font-family:var(--display);font-size:22px;color:var(--gold-hi)}
#bP1{right:calc(env(safe-area-inset-right,0px) + 132px);bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
#bP2{right:calc(env(safe-area-inset-right,0px) + 64px);bottom:calc(env(safe-area-inset-bottom,0px) + 132px)}
.pw.empty{opacity:.25}
.pw.dry{color:var(--ash);border-color:rgba(111,101,93,.4)}
.pw .pips{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);display:flex;gap:3px}
.pw .pips i{width:7px;height:3px;background:rgba(234,223,200,.2)}
.pw .pips i.on{background:var(--gold);box-shadow:0 0 5px var(--ember)}
.pw .ring{position:absolute;inset:-4px;border-radius:50%;pointer-events:none}
#bAct{right:calc(env(safe-area-inset-right,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);width:auto;height:40px;border-radius:20px;
  padding:0 18px;font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-hi);
  border-color:rgba(229,180,90,.6);opacity:0;transform:translateY(8px)}
#bAct.on{opacity:1;transform:none}
#bAct:not(.on){pointer-events:none}

/* ---------- toasts / cards ---------- */
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);text-align:center;pointer-events:none;width:min(90vw,700px)}
#toast .t{font-family:var(--display);font-size:clamp(18px,3.4vw,30px);letter-spacing:.2em;color:var(--gold-hi);text-shadow:0 0 18px rgba(255,138,43,.55),0 2px 4px #000;
  opacity:0;transition:opacity .6s,transform .6s;transform:translateY(6px);text-wrap:balance}
#toast .s{font-family:var(--body);font-style:italic;font-size:clamp(14px,2.2vw,18px);color:var(--bone);margin-top:6px;opacity:0;transition:opacity .6s .15s;text-wrap:balance}
#toast.on .t,#toast.on .s{opacity:1;transform:none}
#note{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);font-family:var(--display);font-size:12px;
  letter-spacing:.14em;color:var(--bone);background:rgba(0,0,0,.45);padding:6px 14px;border:1px solid var(--line);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#note.on{opacity:1}

#card{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity 1.1s;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.85))}
#card.on{opacity:1;pointer-events:auto}
#card .in{text-align:center;max-width:min(88vw,760px);padding:0 16px}
#card .k{font-family:var(--display);font-size:12px;letter-spacing:.5em;color:var(--ember);text-transform:uppercase}
#card h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vw,64px);letter-spacing:.14em;margin:.25em 0 .1em;color:var(--bone);
  text-shadow:0 0 30px rgba(255,138,43,.35);text-wrap:balance}
#card .ep{font-family:var(--body);font-style:italic;font-size:clamp(15px,2.4vw,20px);color:var(--bone-dim)}
#card .on1{font-family:var(--body);font-style:italic;font-size:clamp(17px,3vw,26px);color:var(--gold-hi);margin-top:1.4em;line-height:1.35;text-wrap:balance}
#card .tr{font-family:var(--body);font-size:clamp(14px,2.2vw,18px);color:var(--bone);margin-top:.6em;line-height:1.45;text-wrap:balance}
#card .src{font-family:var(--display);font-size:10px;letter-spacing:.3em;color:var(--ash);margin-top:1.2em;text-transform:uppercase}
#card .tap{font-family:var(--display);font-size:10px;letter-spacing:.3em;color:var(--ash);margin-top:2.4em;opacity:.8;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.25}}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
#hurtv{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,10,5,.55))}

/* ---------- dialogue ---------- */
#dlg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);width:min(94vw,780px);
  display:flex;gap:14px;align-items:flex-start;padding:14px 18px 16px;background:linear-gradient(180deg,rgba(18,13,11,.94),rgba(9,7,6,.96));
  border:1px solid rgba(229,180,90,.32);box-shadow:0 10px 40px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#dlg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#dlg::before,#dlg::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold);opacity:.6}
#dlg::before{left:-4px;top:-4px;border-right:0;border-bottom:0}
#dlg::after{right:-4px;bottom:-4px;border-left:0;border-top:0}
#dlg canvas{flex:none;width:76px;height:76px;border-radius:50%;border:1px solid rgba(229,180,90,.5);background:#0b0807}
#dlg.np canvas{display:none}
#dlg .tx{flex:1;min-width:0}
#dlg .who{font-family:var(--display);font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:4px}
#dlg .say{font-size:clamp(15px,2.3vw,19px);line-height:1.42;min-height:2.8em;color:var(--bone)}
#dlg.narr .say{font-style:italic;color:#d9ccb3}
#dlg.stone .say{font-family:var(--display);font-size:clamp(13px,2vw,16px);letter-spacing:.06em;line-height:1.6;color:#d6c8a8}
#dlg .more{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--gold);animation:pulse 1.4s infinite}
#choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#choices button{text-align:left;background:rgba(229,180,90,.06);border:1px solid rgba(229,180,90,.28);padding:8px 12px;cursor:pointer;
  font-size:clamp(14px,2.1vw,17px);color:var(--bone);transition:background .15s}
#choices button:hover,#choices button:active{background:rgba(229,180,90,.18)}
#choices button .nw{color:var(--ember);font-family:var(--display);font-size:11px;margin-left:8px;letter-spacing:.15em}
#choices button.bye{color:var(--bone-dim);font-style:italic}

/* ---------- panels: menu / shop / title ---------- */
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,4,3,.72);
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.panel.on{display:flex}
.sheet{width:min(96vw,860px);max-height:100%;overflow:auto;background:linear-gradient(180deg,#15100d,#0b0807);border:1px solid rgba(229,180,90,.3);
  padding:18px 20px 20px;box-shadow:0 20px 60px #000;touch-action:pan-y}
.sheet h2{font-family:var(--display);font-weight:600;letter-spacing:.24em;font-size:17px;margin:0 0 4px;color:var(--gold-hi);text-transform:uppercase}
.sheet h3{font-family:var(--display);font-weight:400;letter-spacing:.24em;font-size:11px;margin:16px 0 8px;color:var(--ember);text-transform:uppercase}
.sheet p.lead{margin:0 0 6px;color:var(--bone-dim);font-style:italic}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.cols>*{min-width:0}
#mapc{width:100%;aspect-ratio:1/1;max-height:52vh;background:#0a0807;border:1px solid var(--line);display:block;object-fit:contain}
.row{display:flex;gap:8px;flex-wrap:wrap}
.mbtn{background:rgba(229,180,90,.07);border:1px solid rgba(229,180,90,.32);padding:9px 14px;cursor:pointer;font-family:var(--display);
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone)}
.mbtn:active{background:rgba(229,180,90,.2)}
.mbtn.warn{border-color:rgba(194,47,34,.6);color:#f0b4a8}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pcard{border:1px solid var(--line);padding:8px;cursor:pointer;background:rgba(255,255,255,.02);min-width:0}
.pcard.lock{opacity:.3;cursor:default}
.pcard.sel{border-color:var(--gold);background:rgba(229,180,90,.1)}
.pcard .g{font-family:var(--display);font-size:22px;color:var(--gold-hi)}
.pcard .n{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.pcard .d{font-size:13px;color:var(--bone-dim);line-height:1.3;margin-top:3px}
.pcard .sl{font-family:var(--display);font-size:10px;color:var(--ember);letter-spacing:.1em}
.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:15px}
.stat b{font-family:var(--display);font-weight:400;color:var(--gold-hi);font-size:13px}
.shop .item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;border-bottom:1px solid var(--line);padding:10px 0;align-items:center}
.shop .item .n{font-family:var(--display);letter-spacing:.12em;font-size:13px;text-transform:uppercase}
.shop .item .d{font-size:14px;color:var(--bone-dim);grid-column:1}
.shop .item .lv{display:flex;gap:3px;margin-top:4px}
.shop .item .lv i{width:12px;height:4px;background:rgba(234,223,200,.18)}
.shop .item .lv i.on{background:var(--gold)}
.shop .item button{grid-row:1/4;grid-column:2}
.shop .item button[disabled]{opacity:.35}
.purse{font-family:var(--display);color:var(--gold-hi);letter-spacing:.1em}
input[type=range]{width:100%;accent-color:var(--gold)}
label.set{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:15px;margin:6px 0}

#title{position:fixed;inset:0;background:radial-gradient(ellipse 60% 45% at 50% 40%,rgba(4,6,10,.62),rgba(4,6,10,0));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));transition:opacity 1.2s}
#title.off{opacity:0;pointer-events:none}
#title .k{font-family:var(--display);font-size:11px;letter-spacing:.6em;color:var(--ember);text-transform:uppercase}
#title h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,12vw,124px);letter-spacing:.2em;margin:0;padding-left:.2em;line-height:1;
  background:linear-gradient(180deg,#fff3d6,#e5b45a 55%,#8a5320);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,138,43,.35)) drop-shadow(0 3px 2px #000)}
#title .st{font-family:var(--body);font-style:italic;font-size:clamp(15px,2.6vw,22px);color:var(--bone)}
#title .menu{display:flex;flex-direction:column;gap:10px;margin-top:4vh;min-width:220px}
#title .menu button{background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 26px;cursor:pointer;
  font-family:var(--display);font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone);transition:color .2s,background .2s}
#title .menu button:active,#title .menu button:hover{color:var(--gold-hi);background:rgba(229,180,90,.07)}
#title .menu button[hidden]{display:none}
#title .foot{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:12px;color:var(--ash);font-style:italic;padding:0 16px}
#confirm{display:none;flex-direction:column;gap:8px;align-items:center;margin-top:2vh;font-size:15px}
#confirm.on{display:flex}
#rot{position:fixed;inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 54px) 0;text-align:center;font-size:13px;color:var(--bone-dim);font-style:italic;display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
#credits{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;overflow:hidden;background:#000;pointer-events:auto}
#credits.on{display:flex}
#credits .roll{text-align:center;padding:0 16px 40px;max-width:640px;will-change:transform}
#credits h2{font-family:var(--display);letter-spacing:.3em;color:var(--gold-hi);font-weight:400;font-size:20px;margin:1.6em 0 .4em}
#credits p{margin:.3em 0;line-height:1.5;color:var(--bone)}
#credits .q{font-style:italic;color:var(--bone-dim)}
@media (orientation:landscape){
  #title{align-items:flex-start;text-align:left;padding-left:max(6vw,env(safe-area-inset-left,0px));background:radial-gradient(ellipse 48% 70% at 22% 50%,rgba(4,6,10,.7),rgba(4,6,10,0))}
  #title h1{font-size:clamp(40px,9vw,112px);letter-spacing:.16em;padding-left:0}
  #title .k{letter-spacing:.5em}
  #title .st{max-width:44vw}
  #title .menu{align-items:stretch}
  #title .foot{left:max(6vw,env(safe-area-inset-left,0px));padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div class="hpwrap">
    <div class="hprow">
      <svg class="knot" viewBox="0 0 40 40" fill="none" stroke="#e5b45a" stroke-width="2.2" stroke-linejoin="round"><path d="M20 4 33 27H7Z"/><path d="M12 13 25 36 38 13Z" transform="translate(-6 0)"/><path d="M14 13h24L26 34Z" opacity=".75"/></svg>
      <div class="hpbar"><i class="lag" id="hpLag"></i><i class="fill" id="hpFill"></i><i class="shine"></i></div>
    </div>
    <div class="sub"><span>Silfr <b id="silver">0</b></span><span class="runes" id="runeUI"><span></span><span></span></span><span id="locName"></span></div>
  </div>
  <button id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 16 16" fill="#eadfc8"><rect x="3" y="2" width="3.4" height="12"/><rect x="9.6" y="2" width="3.4" height="12"/></svg></button>
</div>

<div id="bossbar"><div class="nm" id="bossName"></div><div class="bar"><i class="lag" id="bossLag"></i><i class="fill" id="bossFill"></i><span class="tick"></span></div></div>

<div id="ctrl" class="hide">
  <div id="stickZone"><div id="stickBase"></div><div id="stickKnob"></div></div>
  <div id="stickHint"></div>
  <button class="btn" id="bAct">Talk</button>
  <button class="btn pw" id="bP1"><span class="g"></span><span class="pips"></span><svg class="ring" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="none" stroke="#e5b45a" stroke-width="2" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 30 30)"/></svg></button>
  <button class="btn pw" id="bP2"><span class="g"></span><span class="pips"></span><svg class="ring" viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="none" stroke="#e5b45a" stroke-width="2" stroke-dasharray="176" stroke-dashoffset="176" transform="rotate(-90 30 30)"/></svg></button>

/* ---------------- Útgarða-Loki, the king who is smaller than he looks ---------------- */
function drawUtgard(b) {

  if (A.fade.v < .02) return;
  const one = (x, y, alpha, real, ph) => {

    const sw = Math.sin(t * 2 + ph) * 8, ink = '#040804', fl = real && b.flash > 0;

function* csPrologue() {
  G.fade = 1; setVig('deathbed'); playMusic('memory'); ambience(null);
  yield fadeTo(0, 2.2);
  yield* talk([
    ['narr', "Hordaland. The dark of the year, nine winters after the battle at Hrafnsey."],
    ['narr', "Einar Hallvarðsson won his word-fame young. Nineteen summers in the shield-wall, and the skalds knew his name from Stord to the Vík."],
    ['narr', "Then a spear at Hrafnsey. A Valkyrie came down through the smoke. She looked at him a long while, and passed him by."],
    ['narr', "He lived. Lame, he lived seven more winters, mending nets for men who had once followed him."],
    ['narr', "And when death came at last, it found him in his bed. In the straw."],
  ]);
  G.vigFlag = 1; G.vigFlagT = G.vigT; SFX.hiss();
  yield wait(2.2);
  yield fadeTo(1, 1.6);
  yield card({ k: 'Strá-dauði · the straw-death', n: 'Deyr fé, deyja frændr, deyr sjalfr it sama; en orðstírr deyr aldregi, hveim er sér góðan getr.', t: 'Cattle die, kinsmen die, and so one dies oneself. But word-fame never dies, for the one who earns it well.', s: 'Hávamál · 76' });
  yield fadeTo(1, .1); cardHide();
  setVig('void'); playMusic('void'); ambience('void');
  yield fadeTo(0, 2.5);
  yield wait(1.2);
  yield* talk([
    ['odin', "Einar. Hallvard’s son. You died badly."],
    ['einar', "I know how I died."],
    ['odin', "Hel’s road is long, and her hall is cold, and no one down there remembers anything worth singing."],
    ['odin', "But I have work for a man with nothing left to lose."],
    ['odin', "The jötnar stir before their hour. Four jarls of Jötunheim have broken their oaths, and their kin are marching on the walls of the world."],
    ['odin', "Break them. Break the four, and the one who sits behind them in the Outer Yard, and I will open the doors of Valhalla to you myself."],
  ]);
  const c = yield ask('einar', "…", ["Why me?", "Point me at them."]);
  if (c === 0) yield* talk([['odin', "Because no one else would come."], ['odin', "And because someone asked it of me. Someone who should have known better."]]);

/* =====================================================================
   VIGNETTE ART — the painted memory-scenes.
   Every figure is a Path2D whose sub-shapes all wind clockwise, so they
   union into one silhouette; it is filled dark and rim-lit from the
   scene's light (vsil), or filled lit with a shade crescent (vlit).
   ===================================================================== */
const vArea = pts => { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; } return a; };
function vcr(P, pts) { // closed Catmull-Rom curve through the points
  if (vArea(pts) < 0) pts = pts.slice().reverse();
  const n = pts.length, at = i => pts[(i + n) % n];
  P.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < n; i++) {
    const a = at(i - 1), b = at(i), c = at(i + 1), d = at(i + 2);
    P.bezierCurveTo(b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6, c[0] - (d[0] - b[0]) / 6, c[1] - (d[1] - b[1]) / 6, c[0], c[1]);
  }
  P.closePath(); return P;
}
function vpoly(P, pts) { if (vArea(pts) < 0) pts = pts.slice().reverse(); P.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) P.lineTo(pts[i][0], pts[i][1]); P.closePath(); return P; }
function vcirc(P, x, y, r) { P.moveTo(x + r, y); P.arc(x, y, r, 0, TAU); return P; }
function vell(P, x, y, rx, ry, rot = 0) { P.moveTo(x + Math.cos(rot) * rx, y + Math.sin(rot) * rx); P.ellipse(x, y, rx, ry, rot, 0, TAU); return P; }
function vlimb(P, pts, ws) { // tapered limb along a polyline
  const n = pts.length, L = [], R = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = ws[i] / 2; L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); R.unshift([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  vpoly(P, L.concat(R));
  for (let i = 0; i < n; i++) vcirc(P, pts[i][0], pts[i][1], ws[i] / 2);
  return P;
}
function vleaf(P, x, y, a, L, w, curl = 0) { // a pointed leaf / feather / lock of hair, clockwise
  const dx = Math.cos(a), dy = Math.sin(a), nx = dy, ny = -dx, c = curl;
  const tx = x + dx * L - nx * c, ty = y + dy * L - ny * c;
  P.moveTo(x + nx * w * .5, y + ny * w * .5);
  P.bezierCurveTo(x + dx * L * .3 + nx * w, y + dy * L * .3 + ny * w, x + dx * L * .75 + nx * w * .5 - nx * c * .8, y + dy * L * .75 + ny * w * .5 - ny * c * .8, tx, ty);
  P.bezierCurveTo(x + dx * L * .7 - nx * (w * .4 + c * .8), y + dy * L * .7 - ny * (w * .4 + c * .8), x + dx * L * .3 - nx * w * .65, y + dy * L * .3 - ny * w * .65, x - nx * w * .5, y - ny * w * .5);
  P.closePath(); return P;
}
function vsil(g, P, dark, rim, rw = 2, lx = .6, ly = -.8) {
  if (rim) { g.fillStyle = rim; g.fill(P); g.save(); g.clip(P); g.translate(-lx * rw, -ly * rw); }
  g.fillStyle = dark; g.fill(P); if (rim) g.restore();
}
function vlit(g, P, lit, shade, off = 3, lx = .6, ly = -.8) {
  g.fillStyle = shade; g.fill(P); g.save(); g.clip(P); g.translate(lx * off, ly * off); g.fillStyle = lit; g.fill(P); g.restore();
}
const vA = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
const vM = (a, v, k) => [a[0] + v[0] * k, a[1] + v[1] * k];
const vMM = (a, v, k, w, j) => [a[0] + v[0] * k + w[0] * j, a[1] + v[1] * k + w[1] * j];

/* ---------------- smoke: soft puffs that climb and lean in the wind ---------------- */
const PUFF = {};
function puffSpr(col, v) {
  const key = col + v; if (PUFF[key]) return PUFF[key];
  const N = 128, c = mkCanvas(N, N), g = c.getContext('2d'), f = fogTex(), ox = -(v * 61) % 256, oy = -(v * 97) % 256;
  const rg = g.createRadialGradient(N / 2, N / 2, 0, N / 2, N / 2, N / 2);
  rg.addColorStop(0, 'rgba(255,255,255,.75)'); rg.addColorStop(.6, 'rgba(255,255,255,.3)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, N, N);
  for (let y = oy; y < N; y += 256) for (let x = ox; x < N; x += 256) g.drawImage(f, x, y);
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = rg; g.fillRect(0, 0, N, N);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, N, N);
  return PUFF[key] = c;
}
function vsmoke(g, x, y, hgt, wid, col, a, t, seed, wind = .3) {
  const n = 18;
  for (let i = 0; i < n; i++) {
    const f = (i / n + t * .035 * (1 + hash2(seed, i) * .4)) % 1;
    const yy = y - f * hgt, xx = x + wind * f * f * hgt + Math.sin(f * 5 + seed + t * .25) * wid * .3;
    const r = wid * (.45 + f * 1.7), al = a * Math.min(1, f * 7) * Math.pow(1 - f, .7);
    g.globalAlpha = al; g.drawImage(puffSpr(col, (i + seed) % 4), xx - r, yy - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;
}
function vflame(g, x, y, s, t, seed, n = 6) { // a tongue of fire, additive
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const P = new Path2D(), fl = Math.sin(t * (9 + i) + seed * 3 + i * 2), ox = (hash2(seed, i) - .5) * 26 * s;
    vleaf(P, x + ox, y, -PI / 2 + fl * .18 + (hash2(i, seed) - .5) * .5, (30 + 26 * hash2(seed, i + 9) + fl * 8) * s, 12 * s, fl * 5 * s);
    g.fillStyle = i % 2 ? 'rgba(255,200,90,.55)' : 'rgba(255,110,40,.5)'; g.fill(P);
  }
  g.restore();
  vglow(g, x, y - 16 * s, 70 * s, '#ff8a3a', .6);
}
function vember(g, w, h, n, seed, t, col, sp = 30, sz = 4) {
  for (let i = 0; i < n; i++) { const ex = (hash2(i, seed) * w + Math.sin(t * .8 + i) * 24) % w, ey = h - ((hash2(i, seed + 1) * h + t * sp * (.6 + hash2(i, seed + 2))) % h); vglow(g, ex, ey, sz * (.6 + hash2(i, seed + 3)), col, .55); }
}

/* ---------------- ravens ---------------- */
function vRaven(g, x, y, s, t, o = {}) {
  const P = new Path2D(), f = Math.sin(t * 7 + (o.ph || 0));
  if (o.perch) {
    vcr(P, [[-12, -2], [-4, -9], [8, -11], [13, -16], [18, -15], [20, -12], [14, -7], [10, 0], [2, 5], [-8, 4]]);
    vpoly(P, [[-10, -2], [-27, 9], [-23, 11], [-6, 4]]);
    vpoly(P, [[19, -15], [28, -12], [19, -10.5]]);
    vlimb(P, [[2, 3], [3, 12]], [2.2, 1.6]);
  } else {
    vcr(P, [[-14, -1], [0, -5], [14, -4], [19, -6], [22, -3], [16, 1], [0, 4], [-12, 3]]);
    vpoly(P, [[-12, -2], [-27, -6], [-29, 0], [-27, 6], [-12, 3]]);
    vpoly(P, [[21, -5], [29, -2], [21, -1]]);
    for (const k of [1, .75]) { const ff = f * k; vpoly(P, [[7, -1], [2, -1 - 16 * ff], [-5, -1 - 30 * ff], [-10, -1 - 34 * ff], [-12, -1 - 29 * ff], [-15, -1 - 30 * ff], [-16, -1 - 25 * ff], [-19, -1 - 25 * ff], [-15, -1 - 10 * ff], [-7, 1]]); }
  }
  g.save(); g.translate(x, y); g.scale(s * (o.face || 1), s);
  vsil(g, P, o.col || '#07060a', o.rim, 1.2 / s, (o.lx ?? .6) * (o.face || 1), o.ly ?? -.8);
  g.restore();
}

/* ---------------- toasts & notes ---------------- */

/* ---------------- death & the fire that calls you back ---------------- */
const RISE = ["Rise, Einar. Not yet.", "Up. The fire’s still lit.", "Again. I’m here.", "You fell forward. Good. Now get up.", "Breathe. I have you.", "Not like this. Up."];

function respawn() {

    if (G.trial) { for (const e of G.enemies) if (e.trial) e.dead = true, e.deadT = 1; G.trial = null; }
    const w = G.world, rs = RS(sc.id), st = w.nodes[0];
    const p = rs.cp ? { x: rs.cp.x, y: rs.cp.y + 44 } : { x: st.x, y: st.y + 64 };

/* ---------------- interaction ---------------- */
function nodeLabel(n) {

  switch (n.t) {
    case 'well': return 'Drink';
    case 'altar': return r.runes[n.rune] || G.trial ? null : 'Claim rune';
    case 'shrine': return done ? null : 'Pray';
    case 'apple': return done ? null : 'Eat';
    case 'lore': return 'Read';
    case 'chest': return done ? null : 'Open';
    case 'feather': return done ? null : 'Take';
    case 'gate': return r.runes[0] && r.runes[1] ? 'Enter' : 'Sealed';
    case 'start': return 'Return';
  }
  return null;
}
function findInteract() {

  let best = null, bd = 1e9;
  const consider = (x, y, r, label, fn) => { if (!label) return; const d = Math.hypot(P.x - x, P.y - y); if (d < r && d < bd) { bd = d; best = { label, fn }; } };
  const sc = G.scene;
  if (sc.kind === 'hub') {
    for (const n of G.npcs) consider(n.x, n.y, n.perch ? 100 : 66, n.wolf ? 'Pet' : 'Talk', () => talkTo(n));
    const fx = clamp(P.x, 880, 1120), fy = clamp(P.y, 790, 812);
    consider(P.x + (fx - P.x), P.y + (fy - P.y), 46, 'Rest', restAtFire);
    for (const gt of GATES) consider(gt.x, gt.y, 92, gateOpen(gt.id) ? 'Enter' : 'Sealed', () => useGate(gt));
    if (S.feathers >= 4 && !S.cloak) consider(SWAN.x, SWAN.y, 140, 'Lay feathers', useSwan);
  } else if (sc.kind === 'realm') {
    for (const n of G.world.nodes) { const r = ACT_R[n.t]; if (r) consider(n.x, n.y, r, nodeLabel(n), () => useNode(n)); }
  }
  return best;
}
function talkTo(n) {

  runCS(topicMenu(n.id));
}
const GREET = {
  hildr: () => S.ending ? "There you are." : S.f.night ? "Come and sit." : S.f.twist ? "Einar." : "The fire’s warm. Sit, if you like.",
  bjarki: () => "Ho! The axe-man! Come here, let me see that edge.",
  asta: () => !S.powers.frigg ? "Come closer, straw-man." : "The far things are loud today.",
  kolr: () => "Einar! I was just rhyming something with your name. Nothing rhymes with your name.",
  muninn: () => "Kraa. What.",
};
const AGAIN = { hildr: ["Something else?", "Mm?"], bjarki: ["What else?", "Speak up, I’m half-deaf from the hammer."], asta: ["Ask.", "Well?"], kolr: ["Another question? Excellent. Ask.", "Go on."], muninn: ["Hurry up.", "And?"] };
function* topicMenu(id) {

    const list = TOPICS[id].filter(t => !t.if || t.if());
    if (id === 'asta' && !S.powers.frigg) { const g = list.find(t => t.id === 'gift'); S.seen['asta.gift'] = 1; yield* g.run(); }
    const opts = list.filter(t => !(id === 'asta' && t.id === 'gift')).map(t => ({ t: t.t, nw: !S.seen[id + '.' + t.id] && !t.always, tp: t }));
    opts.push({ t: 'Farewell.', bye: 1 });

  for (const e of G.enemies) if (!e.dead && Math.hypot(e.x - T.x, e.y - T.y) < T.R + 60) { e.x = T.x + (e.x - T.x) * 2; e.y = T.y + (e.y - T.y) * 2; }

}

}

let titleT = 0;

/* ---------------- camera ---------------- */
function bossBox(b) { // the screen-space footprint of a jötunn, so the camera can hold all of it

  switch (b.id) {
    case 'angr': return [b.x - 270, b.y - 600 + b.an.sink.v * 440, b.x + 270, b.y + 100];
    case 'thrym': return [b.x - 240, b.y - 640, b.x + 240, b.y + 60];
    case 'nidhogg': { const h = b.hole; return [h.x - 260, h.y - 560 * Math.max(.4, b.an.em.v), h.x + 260, h.y + 80]; }
    case 'surtr': return [b.x - 320, b.y - 700 - b.an.air.v * 500, b.x + 320, b.y + 70];
    case 'utgard': return b.skry ? [a.x - 470, a.y - a.R - 560, a.x + 470, a.y + 140] : [b.x - 110, b.y - 390, b.x + 110, b.y + 30];
    case 'skogul': return [b.x - 90, b.y - 140 - Math.min(200, b.an.z.v), b.x + 90, b.y + 24];
  }
  return [b.x - 100, b.y - 200, b.x + 100, b.y + 40];
}
function spanFor(wd, ht) { const z = Math.min(W / wd, H / ht); return Math.min(W, H) / z; }
function updCam(rdt) {
  if (!P) return;
  let tx = P.x + Math.cos(P.face) * 16, ty = P.y - 24 + Math.sin(P.face) * 10, span = cam.span;
  const b = G.boss;
  if (G.scene.kind === 'arena' && b && !b.dead) {
    const bb = bossBox(b);
    const x0 = Math.min(bb[0], P.x - 80), x1 = Math.max(bb[2], P.x + 80), y0 = Math.min(bb[1], P.y - 80), y1 = Math.max(bb[3], P.y + 60) + 40;
    tx = (x0 + x1) / 2; ty = (y0 + y1) / 2;
    span = clamp(spanFor((x1 - x0) * 1.1, (y1 - y0) * 1.1), 560, 1600);
    cam.span = lerp(cam.span, span, 1 - Math.exp(-rdt * 1.4)); span = cam.span;
  }
  if (G.camLock) { tx = G.camLock.x; ty = G.camLock.y; span = G.camLock.span || span; }
  const k = 1 - Math.exp(-rdt * (G.camLock ? 2.4 : 5));
  cam.x = lerp(cam.x, tx, k); cam.y = lerp(cam.y, ty, k);
  cam.z = lerp(cam.z, zoomForSpan(span), 1 - Math.exp(-rdt * 2.6));
  const w = G.world, hw = W / 2 / cam.z, hh = H / 2 / cam.z;
  if (w && w.kind !== 'arena') { if (w.w > hw * 2) cam.x = clamp(cam.x, hw - 40, w.w - hw + 40); if (w.h > hh * 2) cam.y = clamp(cam.y, hh - 60, w.h - hh + 40); }
  cam.shake *= Math.exp(-rdt * 9); if (cam.shake < .05) cam.shake = 0;
  cam.sx = rand(-1, 1) * cam.shake; cam.sy = rand(-1, 1) * cam.shake;
}

/* ---------------- lights ----------------
   a coloured light map multiplied over the scene: ambient tint, plus the glowing
   ground itself, plus every fire, spring and rune. */
function renderLights() {
  const w = G.world; if (!w) return;
  const amb = (w.look && w.look.amb) || [180, 170, 160];
  const lw = LC.width, lh = LC.height, s = lw / W;
  lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.globalCompositeOperation = 'source-over'; lctx.globalAlpha = 1;
  lctx.fillStyle = `rgb(${amb[0]},${amb[1]},${amb[2]})`; lctx.fillRect(0, 0, lw, lh);
  lctx.globalCompositeOperation = 'lighter';
  const z = cam.z * s;
  lctx.setTransform(z, 0, 0, z, (W / 2 - (cam.x + cam.sx) * cam.z) * s, (H / 2 - (cam.y + cam.sy) * cam.z) * s);
  if (w.emis) drawEmissive(lctx, 1.3);

  for (const L of G.lights) { if (!inView(L.x, L.y, L.r)) continue; lctx.globalAlpha = Math.min(1, L.i); lctx.drawImage(glowSprite(L.col || '#ffb070'), L.x - L.r, L.y - L.r, L.r * 2, L.r * 2); }

  lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'source-over'; lctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = true;

/* ---------------- render ---------------- */
const _list = [];

}
function drawHubVoid() {
  const t = G.t;
  for (let i = 0; i < 40; i++) { const x = (hash2(i, 7) * 2000), y = 1280 + hash2(i, 8) * 220; if (!inView(x, y, 20)) continue; const tw = .5 + .5 * Math.sin(t * (1 + hash2(i, 9) * 3) + i); glow(x, y, 6, '#cfd8ff', tw * .6); }
  for (let i = 0; i < 4; i++) { const x = ((t * 14 + i * 520) % 2400) - 200, y = 1330 + i * 40; if (!inView(x, y, 400)) continue; ctx.globalAlpha = .18; ctx.drawImage(fogTint('#8090c0'), x - 300, y - 90, 600, 180); ctx.globalAlpha = 1; }

function post() {

  if (GRAINPAT) { const ox = Math.random() * 160 | 0, oy = Math.random() * 160 | 0; ctx.globalAlpha = .045; ctx.setTransform(DPR, 0, 0, DPR, -ox * DPR, -oy * DPR); ctx.fillStyle = GRAINPAT; ctx.fillRect(ox, oy, W, H); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; }
  if (G.flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = hexA(G.flashCol, Math.min(1, G.flash) * .6); ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalCompositeOperation = 'source-over'; }

/* ---------------- update ---------------- */
function update(dt, rdt) {
  G.t += dt;
  musUpdate(); dlgUpdate(rdt); csUpdate(rdt);
  if (G.fade !== G.fadeTo) { const d = G.fadeTo - G.fade, s = G.fadeSp * rdt; G.fade = Math.abs(d) <= s ? G.fadeTo : G.fade + Math.sign(d) * s; }
  G.flash = Math.max(0, G.flash - rdt * 2.2); G.hurtV = Math.max(0, G.hurtV - rdt * 1.6); G.lightning = Math.max(0, G.lightning - rdt * 2.5);
  if (toastT > 0) { toastT -= rdt; if (toastT <= 0) $('toast').classList.remove('on'); }
  if (G.noteT > 0) { G.noteT -= rdt; if (G.noteT <= 0) $('note').classList.remove('on'); }
  if (G.cardOpen) G.cardT += rdt;
  hudUpdate();
  if (G.scene && G.scene.kind === 'title') { if (G.world && P && !G.vig) { updBoss(dt); updParts(dt); updWeather(dt); titleAnim(dt); } return; }
  if (G.vig || !G.world || !P || G.menu || !G.scene) return;

  if (IN.act && G.interact) { SFX.ui(); G.interact.fn(); }
  if (P.state === 'dead' && P.st > 1.5 && !G.cs) runCS(deathCS());
  if (G.boss && G.boss.intro === false && !G.boss.dead) hudBoss();
}

/* ---------------- the loop ---------------- */
let lastTs = 0;
function frame(ts) {
  const now = ts / 1000; let rdt = lastTs ? now - lastTs : 1 / 60; lastTs = now; rdt = Math.min(rdt, 1 / 20);
  G.rt += rdt;
  if (G.slowT > 0) { G.slowT -= rdt; G.ts = lerp(G.ts, .28, .25); } else G.ts = lerp(G.ts, 1, .12);
  let dt = rdt * G.ts;
  if (G.hitstop > 0) { G.hitstop -= rdt; dt *= .05; }
  boilT += rdt; if (boilT > .1) { boilT = 0; BOIL++; }
  QUAL.acc += rdt; QUAL.n++;
  if (QUAL.acc > 2.5) { const avg = QUAL.acc / QUAL.n; QUAL.acc = 0; QUAL.n = 0; if (G.playing && !G.cs) { if (avg > 1 / 38 && QUAL.cap > 1) { QUAL.cap = Math.max(1, QUAL.cap - .25); resize(); } else if (avg < 1 / 57 && QUAL.cap < QUAL.max) { QUAL.cap = Math.min(QUAL.max, QUAL.cap + .25); resize(); } } }
  try { update(dt, rdt); render(rdt); }
  catch (err) { console.error(err); }
  clearPresses();
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
function boot() {
  resize(); addEventListener('resize', resize);
  bindInput();
  $('dlg').addEventListener('pointerdown', e => { if (e.target.closest('#choices')) return; e.preventDefault(); dlgTap(); });
  window.addEventListener('pointerdown', e => {
    audioInit();
    if (G.cardOpen && G.cardT > .5 && !e.target.closest('.panel')) { cardHide(); return; }
    if (DLG.open && !DLG.passive && !e.target.closest('#dlg') && !e.target.closest('.panel') && !e.target.closest('#ctrl')) dlgTap();
  }, true);
  $('tNew').addEventListener('click', () => { audioInit(); SFX.ui(); if (loadSave()) { $('confirm').classList.add('on'); return; } startNew(); });
  $('cYes').addEventListener('click', () => { SFX.ui(); wipeSave(); for (const k in WORLDS) delete WORLDS[k]; G.explored = {}; startNew(); });
  $('cNo').addEventListener('click', () => { SFX.ui(); $('confirm').classList.remove('on'); });
  $('tContinue').addEventListener('click', () => { audioInit(); SFX.ui(); continueGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && AU.ctx) AU.ctx.suspend(); else if (AU.ctx) AU.ctx.resume(); });
  toTitle();
  requestAnimationFrame(frame);
  // a hot-reload hook for the artifact viewer, when present
  try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save: S })); } catch (e) { }
}
window.EIN = { G, get S() { return S; }, set S(v) { S = v; }, get P() { return P; }, enterRealm, enterArena, enterHub, arenaIntro, runCS, startNew, continueGame, REALMS, BOSS_DEFS, hurtPlayer, grantPower, IN, toTitle, store };
boot();
